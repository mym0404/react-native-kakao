name: Release

on:
  push:
    branches:
      - main
      - v2

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify current branch head
        id: current
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          branch_head=$(git ls-remote --exit-code origin "refs/heads/${RELEASE_BRANCH}" | cut -f1)
          if [[ "${branch_head}" == "${EXPECTED_SHA}" ]]; then
            echo "matches=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Ignoring stale release run for ${EXPECTED_SHA}; ${RELEASE_BRANCH} is now ${branch_head}."
            echo "matches=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node and Yarn
        if: steps.current.outputs.matches == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.7
          install_args: node yarn
          cache: true

      - name: Install dependencies
        if: steps.current.outputs.matches == 'true'
        run: yarn install --immutable

      - name: Select release mode
        if: steps.current.outputs.matches == 'true'
        id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify current branch head
        id: current
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          branch_head=$(git ls-remote --exit-code origin "refs/heads/${RELEASE_BRANCH}" | cut -f1)
          if [[ "${branch_head}" == "${EXPECTED_SHA}" ]]; then
            echo "matches=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Ignoring stale release run for ${EXPECTED_SHA}; ${RELEASE_BRANCH} is now ${branch_head}."
            echo "matches=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node and Yarn
        if: steps.current.outputs.matches == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.7
          install_args: node yarn
          cache: true

      - name: Install dependencies
        if: steps.current.outputs.matches == 'true'
        run: yarn install --immutable

      - name: Create or update version pull request
        if: steps.current.outputs.matches == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
          script: yarn release:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          pr-base-branch: ${{ github.ref_name }}

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify current branch head
        id: current
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          branch_head=$(git ls-remote --exit-code origin "refs/heads/${RELEASE_BRANCH}" | cut -f1)
          if [[ "${branch_head}" == "${EXPECTED_SHA}" ]]; then
            echo "matches=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Ignoring stale release run for ${EXPECTED_SHA}; ${RELEASE_BRANCH} is now ${branch_head}."
            echo "matches=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node and Yarn
        if: steps.current.outputs.matches == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.7
          install_args: node yarn
          cache: true

      - name: Install dependencies
        if: steps.current.outputs.matches == 'true'
        run: yarn install --immutable

      - name: Verify release branch
        if: steps.current.outputs.matches == 'true'
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "${RELEASE_BRANCH}" == "v2" ]]; then
            test ! -f .changeset/pre.json
            jq -se 'all(.[]; .version | test("^2\\.[0-9]+\\.[0-9]+$"))' packages/*/package.json
          else
            jq -e '.mode == "pre" and .tag == "next"' .changeset/pre.json
            jq -se 'all(.[]; .version | test("^2\\.[0-9]+\\.[0-9]+-next\\.[0-9]+$"))' packages/*/package.json
          fi

      - name: Publish packages
        if: steps.current.outputs.matches == 'true'
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          script: yarn release
