name: Android emulator diagnostic
on:
  push:
    branches: [feat/agent-device-e2e]
    paths: [.github/workflows/android-emulator-diagnostic.yml]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p diagnostic
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.1'
          target: google_apis_playstore_ps16k
          arch: x86_64
          profile: medium_phone
          ram-size: 4096M
          emulator-options: -no-window -gpu software -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator -noaudio -no-boot-anim -no-snapshot -camera-back none
          pre-emulator-launch-script: cat ~/.android/avd/test.avd/config.ini > diagnostic/avd.ini
          script: >-
            set -e;
            trap 'adb logcat -d > diagnostic/logcat.log' EXIT;
            for sample in $(seq 1 90); do state=$(adb shell am get-started-user-state 0 || true); echo "$state" >> diagnostic/ready.log; if [ "$state" = RUNNING_UNLOCKED ]; then break; fi; sleep 2; done;
            test "$state" = RUNNING_UNLOCKED;
            adb shell am start -W -a android.settings.SETTINGS > diagnostic/launch.log;
            sleep 5;
            adb exec-out screencap -p > diagnostic/settings.png;
            python3 -c 'from pathlib import Path; assert Path("diagnostic/settings.png").read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))';
            sleep 30;
            adb exec-out screencap -p > diagnostic/settings-later.png;
            python3 -c 'from pathlib import Path; assert Path("diagnostic/settings-later.png").read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-diagnostic
          path: diagnostic/
          retention-days: 7
