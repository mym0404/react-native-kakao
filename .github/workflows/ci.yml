  build-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Android E2E Release app
        id: android-e2e-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ runner.os }}-e2e-android-release-${{ runner.arch }}-x86_64-jdk17-v2-${{ hashFiles('mise.toml', '.yarnrc.yml', 'yarn.lock', '.yarn/patches/**', 'package.json', 'tsconfig.json', 'packages/*/package.json', 'packages/*/tsconfig.json', 'packages/*/tsconfig.build.json', 'packages/*/src/**', 'packages/*/android/**', 'packages/core/expo-config-plugin/**', 'packages/core/app.plugin.js', 'example/package.json', 'example/app.json', 'example/src/**', 'example/assets/**', 'example/tsconfig.json', 'example/babel.config.js', 'example/metro.config.js', 'example/react-native.config.js', 'script/e2e/e2e-build.ts', 'script/e2e/e2e-log.ts') }}

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        if: steps.android-e2e-release-cache.outputs.cache-hit != 'true'
        run: yarn build

      - name: Generate Android Example Project
        if: steps.android-e2e-release-cache.outputs.cache-hit != 'true'
        run: yarn gen:android

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: steps.android-e2e-release-cache.outputs.cache-hit != 'true'
        id: android-gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ runner.arch }}-jdk17-v2-${{ hashFiles('mise.toml', 'yarn.lock', '.yarn/patches/**', 'package.json', 'example/package.json', 'example/app.json', 'packages/*/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ runner.arch }}-jdk17-v2-${{ hashFiles('mise.toml', 'yarn.lock', '.yarn/patches/**', 'package.json', 'example/package.json', 'example/app.json', 'packages/*/package.json') }}-

      - name: Build Release app for E2E
        if: steps.android-e2e-release-cache.outputs.cache-hit != 'true'
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn e2e build android --abi x86_64

      - name: Save Gradle cache
        if: steps.android-e2e-release-cache.outputs.cache-hit != 'true' && steps.android-gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ steps.android-gradle-cache.outputs.cache-primary-key }}

      - name: Save Android E2E Release app
        if: steps.android-e2e-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.android-e2e-release-cache.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify example flows on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.1'
          target: google_apis_playstore_ps16k
          arch: x86_64
          profile: medium_phone
          ram-size: 4096M
          disable-animations: true
          # API 37's gralloc mapper requires both features for DMA readback.
          emulator-options: -no-window -gpu software -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: yarn e2e test android --device emulator-5554 --output build/e2e/android

      - name: Upload Android E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android
          path: build/e2e/android/
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

  build-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore iOS E2E Release app
        id: ios-e2e-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/e2e/ios-build/Build/Products/Release-iphonesimulator/KakaoExample.app
          key: ${{ runner.os }}-e2e-ios-release-${{ runner.arch }}-xcode26.2-v2-${{ hashFiles('mise.toml', '.yarnrc.yml', 'yarn.lock', '.yarn/patches/**', 'package.json', 'tsconfig.json', 'packages/*/package.json', 'packages/*/tsconfig.json', 'packages/*/tsconfig.build.json', 'packages/*/*.podspec', 'packages/*/src/**', 'packages/*/ios/**', 'packages/core/expo-config-plugin/**', 'packages/core/app.plugin.js', 'example/package.json', 'example/app.json', 'example/src/**', 'example/assets/**', 'example/tsconfig.json', 'example/babel.config.js', 'example/metro.config.js', 'example/react-native.config.js', 'example/Gemfile', 'example/Gemfile.lock', 'script/e2e/e2e-build.ts', 'script/e2e/e2e-log.ts') }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2'
      - name: Ensure iOS Simulator runtime
        run: |
          simulator_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if ! xcrun simctl list runtimes | grep -Fq "iOS ${simulator_version}"; then
            xcodebuild -downloadPlatform iOS -buildVersion "${simulator_version}"
          fi

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        run: yarn build

      - name: Generate iOS Example Project
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        run: yarn gen:ios

      - name: Restore iOS compiler cache
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        id: ios-ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ runner.arch }}-xcode26.2-v1-${{ hashFiles('mise.toml', 'yarn.lock', 'example/package.json', 'packages/*/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ runner.arch }}-xcode26.2-v1-${{ hashFiles('mise.toml', 'yarn.lock', 'example/package.json', 'packages/*/package.json') }}-

      - name: Prepare iOS compiler cache
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          ccache --max-size 1G
          ccache --zero-stats

      - name: Cache cocoapods
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        id: cocoapods-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/ios/Pods
          key: ${{ runner.os }}-cocoapods-xcode26.2-v2-${{ hashFiles('yarn.lock', 'example/Gemfile.lock', 'example/app.json', 'packages/*/*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-xcode26.2-v2-

      - name: Install cocoapods
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        run: yarn example pod

      - name: Build Release app for E2E
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
        run: yarn e2e build ios

      - name: Show iOS compiler cache statistics
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache --show-stats

      - name: Save iOS compiler cache
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true' && steps.ios-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ios-ccache.outputs.cache-primary-key }}

      - name: Save iOS E2E Release app
        if: steps.ios-e2e-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/e2e/ios-build/Build/Products/Release-iphonesimulator/KakaoExample.app
          key: ${{ steps.ios-e2e-release-cache.outputs.cache-primary-key }}

      - name: Boot E2E Simulator
        run: |
          simulator_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          device_id=$(xcrun simctl create "Kakao E2E" "iPhone 17 Pro" "com.apple.CoreSimulator.SimRuntime.iOS-${simulator_version//./-}")
          echo "E2E_IOS_DEVICE=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b

      - name: Verify example flows on iOS
        run: yarn e2e test ios --device "$E2E_IOS_DEVICE" --output build/e2e/ios

      - name: Upload iOS E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios
          path: build/e2e/ios/
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

      - name: Stop E2E Simulator
        if: always() && env.E2E_IOS_DEVICE != ''
        run: xcrun simctl shutdown "$E2E_IOS_DEVICE"

  ci-result:
    needs: [changes, lint, build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
        run: |
          echo "changes=$CHANGES_RESULT lint=$LINT_RESULT"
          echo "android=$ANDROID_CHANGED:$ANDROID_RESULT ios=$IOS_CHANGED:$IOS_RESULT"
          for result in "$CHANGES_RESULT" "$LINT_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              echo '::error::Change detection and lint must both succeed.'
              exit 1
            fi
          done
          for build in "$ANDROID_CHANGED:$ANDROID_RESULT" "$IOS_CHANGED:$IOS_RESULT"; do
            case "$build" in
              true:success|false:skipped) ;;
              *) echo '::error::A required build did not succeed or a build was not intentionally skipped.'; exit 1 ;;
            esac
          done

  e2e-report:
    needs: [changes, build-android, build-ios]
    if: always() && !cancelled() && (needs.changes.outputs.android == 'true' || needs.changes.outputs.ios == 'true') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download E2E evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-*
          path: e2e-results

      - name: Prepare E2E screenshots
        if: always()
        run: |
          for platform in android ios; do
            mkdir -p "e2e-images/e2e-$platform"
            cp e2e-results/e2e-$platform/*.png "e2e-images/e2e-$platform/" 2>/dev/null || true
          done

      - name: Publish E2E screenshots
        if: always()
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: e2e-images
          target-folder: e2e/pr-${{ github.event.pull_request.number }}
          clean: true
          commit-message: 'ci: publish E2E screenshots for PR #${{ github.event.pull_request.number }}'

      - name: Comment E2E results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            await require('./script/e2e/e2e-report.js')({ github, context, core });
