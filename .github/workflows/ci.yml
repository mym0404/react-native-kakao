  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [old, new]
    env:
      TURBO_CACHE_DIR: .turbo/android-${{matrix.arch}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Convert Arch
        run: yarn ${{matrix.arch}}

      - name: Cache turborepo for Android
        if: matrix.arch == 'old'
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}-${{matrix.arch}}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-${{matrix.arch}}-

      - name: Check turborepo cache for Android
        if: matrix.arch == 'old'
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run ci:android:build:${{matrix.arch}} --single-package --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'ci:android:build:${{matrix.arch}}').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}-${{matrix.arch}}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{matrix.arch}}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}-

      - name: Build example for Android
        if: matrix.arch == 'old'
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run ci:android:build:${{matrix.arch}} --cache-dir="${{ env.TURBO_CACHE_DIR }}" --single-package

      - name: Build Release app for E2E
        if: matrix.arch == 'new'
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn e2e build android --abi x86_64

      - name: Enable KVM
        if: matrix.arch == 'new'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify example menus on Android
        if: matrix.arch == 'new'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: yarn e2e test android --device emulator-5554 --output build/e2e/android

      - name: Upload Android E2E evidence
        if: always() && matrix.arch == 'new'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android
          path: build/e2e/android/
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [new]
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Ensure iOS Simulator runtime
        run: |
          simulator_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if ! xcrun simctl list runtimes | grep -Fq "iOS ${simulator_version}"; then
            xcodebuild -downloadPlatform iOS -buildVersion "${simulator_version}"
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.2'

      - name: Setup
        uses: ./.github/actions/setup

      - name: Convert Arch
        run: yarn ${{matrix.arch}}

      - name: Cache cocoapods
        id: cocoapods-cache
        uses: actions/cache@v4
        with:
          path: |
            **/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('example/ios/Podfile.lock') }}-${{matrix.arch}}
          restore-keys: |
            ${{ runner.os }}-cocoapods-${{matrix.arch}}-

      - name: Install cocoapods
#        if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
        run: yarn pod:${{matrix.arch}}
        env:
          NO_FLIPPER: 1

      - name: Build Release app for E2E
        run: yarn e2e build ios

      - name: Boot E2E Simulator
        run: |
          device_id=$(xcrun simctl create "Kakao E2E" "iPhone 17 Pro")
          echo "E2E_IOS_DEVICE=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b

      - name: Verify example menus on iOS
        run: yarn e2e test ios --device "$E2E_IOS_DEVICE" --output build/e2e/ios

      - name: Upload iOS E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios
          path: |
            build/e2e/ios/
            !build/e2e/ios/device-state/daemon.json
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

      - name: Stop E2E Simulator
        if: always() && env.E2E_IOS_DEVICE != ''
        run: xcrun simctl shutdown "$E2E_IOS_DEVICE"

  e2e-report:
    needs: [build-android, build-ios]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download E2E evidence
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: e2e-results

      - name: Comment E2E results
        if: always()
        uses: actions/github-script@v7
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- example-agent-device-e2e -->';
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.head.sha !== process.env.PR_HEAD_SHA) return;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId,
            });
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const rows = [];
            const expectedScreenshots = 6;
            for (const platform of ['android', 'ios']) {
              const artifact = artifacts.find(({ name }) => name === `e2e-${platform}`);
              let result;
              try {
                result = JSON.parse(await fs.readFile(`e2e-results/e2e-${platform}/summary.json`, 'utf8'));
              } catch (error) {
                if (error.code !== 'ENOENT') throw error;
              }
              if (result && (
                result.platform !== platform ||
                !['passed', 'failed'].includes(result.status) ||
                !Number.isFinite(result.durationSeconds) || result.durationSeconds < 0 ||
                !Number.isInteger(result.screenshots) || result.screenshots < 0 || result.screenshots > expectedScreenshots
              )) throw new Error(`Invalid ${platform} E2E summary`);
              const status = result ? (result.status === 'passed' ? '✅ Passed' : '❌ Failed') : '⚠️ Not run';
              const seconds = result ? `${result.durationSeconds.toFixed(2)}s` : '—';
              const screenshots = result ? `${result.screenshots}/${expectedScreenshots}` : '—';
              const link = artifact ? `[Download](${runUrl}/artifacts/${artifact.id})` : `[CI logs](${runUrl})`;
              rows.push(`| ${platform} | ${status} | ${seconds} | ${screenshots} | ${link} |`);
            }
            const body = [
              marker, '', '## Example E2E · agent-device', '',
              `Commit: ${process.env.PR_HEAD_SHA} · [CI run](${runUrl})`, '',
              'Home → User → Home → Share → Home → Navi → Home → Social → Home → Channel', '',
              '| Platform | Result | Test time | Screenshots | Artifacts |',
              '| --- | --- | ---: | ---: | --- |',
              ...rows,
              '',
              'Verifies screen entry and titles. Excludes login, feature actions, and pixel comparisons.',
              'Time excludes app installation, iOS runner preparation, and builds. For tests that did not run, check build and device setup logs.',
              'Open `index.html` from the artifact ZIP to compare screenshots. PNGs, JUnit, and logs are retained for 14 days.',
            ].join('\n');
            await core.summary.addRaw(body).write();
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(({ body, user }) => user?.login === 'github-actions[bot]' && body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
