name: CI
on:
  pull_request:
    branches:
      - main
      - v2
      - v3

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect build changes
        id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { detectBuildChanges } = require('./script/ci-changes.js');
            await detectBuildChanges({ github, context, core });

      - name: 'Checked base: ${{ steps.filter.outputs.base }}'
        run: ':'

  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        run: yarn build

      - name: Check
        run: |
          yarn t
          yarn test

#      - name: Cache Gradle
#        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
#        with:
#          path: |
#            ~/.gradle/wrapper
#            ~/.gradle/caches
#          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}
#          restore-keys: |
#            ${{ runner.os }}-gradle-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}-

#  test:
#    runs-on: ubuntu-latest
#    steps:
#      - name: Checkout
#        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
#
#      - name: Setup
#        uses: ./.github/actions/setup
#
#      - name: Run unit tests
#        run: yarn test
#
#  build-library:
#    runs-on: ubuntu-latest
#    steps:
#      - name: Checkout
