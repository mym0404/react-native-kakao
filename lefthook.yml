pre-commit:
  parallel: true
  commands:
    lint:js:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn eslint --cache --max-warnings=0 {staged_files}
    lint:objc:
      glob: '*.{h,mm,m,hpp,cpp,c}'
      run: node ./script/clang-lint.ts {staged_files}
    lint:swift:
      glob: '*.swift'
      run: node ./script/swift-lint.ts {staged_files}
    lint:kotlin:
      glob: '*.kt'
      run: node ./script/ktlint-lint.ts {staged_files}
    typecheck:
      glob: '*.{ts,tsx}'
      run: yarn tsc --noEmit

format:
  parallel: true
  commands:
    format:objc:
      glob: '*.{h,mm,m,hpp,cpp,c}'
      run: node ./script/clang-format.ts {all_files}
    format:swift:
      glob: '*.swift'
      run: node ./script/swift-format.ts {all_files}
    format:kotlin:
      glob: '*.kt'
      run: node ./script/ktlint-format.ts {all_files}

check:
  parallel: true
  commands:
    lint:js:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn eslint --cache --max-warnings=0 {all_files}
    lint:objc:
      glob: '*.{h,mm,m,hpp,cpp,c}'
      run: node ./script/clang-lint.ts {all_files}
    lint:swift:
      glob: '*.swift'
      run: node ./script/swift-lint.ts {all_files}
    lint:kotlin:
      glob: '*.kt'
      run: node ./script/ktlint-lint.ts {all_files}
    typecheck:
      glob: '*.{ts,tsx}'
      run: yarn tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit
