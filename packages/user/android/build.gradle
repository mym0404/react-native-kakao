apply from: file('./../../core/android/package-json.gradle')
def Versions = project.ext.RNCKakaoSdkVersions
Project coreProject = project.ext.getWorkspaceProject("core")
def rnkakaoE2E = (findProperty("rnkakaoE2E") ?: "false").toBoolean() &&
    file("__fixtures__").isDirectory()

project.ext.applyPlugins()

android {
    namespace "net.mjstudio.rnkakao.user"

    compileSdkVersion Versions.compileSdk

    defaultConfig {
        minSdkVersion Versions.minSdk
        targetSdkVersion Versions.targetSdk
        buildConfigField "boolean", "RNKAKAO_E2E", rnkakaoE2E.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        disable "GradleCompatible"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (rnkakaoE2E) {
        sourceSets.main.java.srcDir "__fixtures__"
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-android"

    api coreProject
    implementation "com.kakao.sdk:v2-user:${Versions.user}"
}
