apply from: file('./../../core/android/package-json.gradle')
def Versions = project.ext.RNCKakaoSdkVersions
Project coreProject = project.ext.getWorkspaceProject("core")
Project socialProject = project.ext.getWorkspaceProject("social")

project.ext.applyPlugins()

android {
    namespace "net.mjstudio.rnkakao.share"

    compileSdkVersion Versions.compileSdk

    defaultConfig {
        minSdkVersion Versions.minSdk
        targetSdkVersion Versions.targetSdk
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        disable "GradleCompatible"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-android"

    api coreProject
    api socialProject
    implementation "com.kakao.sdk:v2-share:${Versions.share}"
}
